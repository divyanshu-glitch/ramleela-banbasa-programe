<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>श्री रामलीला कमेटी, बनबसा — संग्रह प्रबंधन प्रणाली</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <style>
    :root {
      --glass-opacity: 0.74;
      --glass-blur: 18px;
    }
    body {
      font-family: 'Noto Sans Devanagari', 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 12% 15%, rgba(254, 215, 170, 0.65), transparent 38%),
                  radial-gradient(circle at 88% 18%, rgba(186, 230, 253, 0.7), transparent 42%),
                  radial-gradient(circle at 50% 85%, rgba(254, 205, 211, 0.55), transparent 45%),
                  #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      margin: 0;
    }
    .liquid-glass {
      background-color: rgba(255, 255, 255, var(--glass-opacity));
      backdrop-filter: blur(var(--glass-blur)) saturate(160%);
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
    }
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: rgba(241, 245, 249, 0.5); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.6); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.85); }
  </style>
</head>
<body class="antialiased selection:bg-orange-200 selection:text-slate-900 pb-12">
  <div id="app"></div>
  <script src="./app.js"></script>
</body>
</html>
